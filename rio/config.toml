# Rio terminal configuration
#
# Only settings that differ from Rio's defaults live here. For the full list of
# options see https://rioterm.com/docs/config — do not paste the upstream sample
# back into this file, it goes stale between releases.
#
# Verified against rioterm 0.5.28.

# Look for themes/<name>.toml next to this file.
theme = "catppuccin-mocha"

# Re-read this file on save, no restart needed.
live-config-reload = true

# Breathing room on the left/right edges. Default 0.
padding-x = 5

# Default is true; skip the "really quit?" prompt.
confirm-before-quit = false

[fonts]
family = "JetBrainsMono Nerd Font Mono"
size = 13
# U+23FA (BLACK CIRCLE FOR RECORD) is missing from JetBrainsMono; borrow it
# from STIX Two Math so it renders instead of showing tofu.
symbol-map = [
  { start = "23FA", end = "23FA", font-family = "STIX Two Math" }
]

[navigation]
# "Plain" draws no tab bar and disables Rio's own tab keybinds; tabs come from
# tmux instead. Keeps the cwd off the drawspace and gives the row back to the
# shell. The only other mode in 0.5.28 is "Tab".
mode = "Plain"

[title]
# Default is "{{ TITLE || RELATIVE_PATH }}", which puts the OSC 7 working
# directory in the WM titlebar. PROGRAM alone is the only variable that cannot
# leak a path — TITLE is whatever tmux reports, and tmux derives it from the
# pane title, which is usually the cwd.
#
# Other variables: TITLE, ABSOLUTE_PATH, RELATIVE_PATH, COLUMNS, LINES.
content = "{{ PROGRAM }}"
