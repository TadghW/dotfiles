set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin"

######################
#### KEYBINDINGS #####
######################

# Change prefix keybinding
# C stands for ctrl
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Change window splitting shortcuts to | for horizontal and - for vertical split
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded."

# Pane navigation
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane resize
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Visual selection and copying
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

######################
#PLUGIN CONFIGURATION#
######################
#set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'

######################
### DESIGN CHANGES ###
######################

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

#  modes
setw -g clock-mode-colour colour10
setw -g mode-style 'fg=colour0 bg=colour105 bold'

# panes
set -g pane-border-style 'fg=colour105'
set -g pane-active-border-style 'fg=colour253'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour105'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10
setw -g window-status-current-style 'fg=colour253 bg=colour105 bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=colour105 dim'
setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour10]#F '

setw -g window-status-bell-style 'fg=colour2 bg=colour105 bold'

set -g history-limit 50000

# messages
set -g message-style 'fg=colour2 bg=colour0 bold'

run '~/.tmux/plguins/tpm/tpm'

